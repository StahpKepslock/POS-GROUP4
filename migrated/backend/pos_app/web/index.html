<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>POS App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>POS</h1>
    <div class="nav">
      <button id="btn-notifications">Notifications <span id="notification-badge" class="badge" style="display:none;">0</span></button>
      <button id="btn-manage">Manage Products</button>
      <button id="btn-new">New Sale</button>
      <button id="btn-sales">View Sales</button>
      <label class="theme-toggle">Theme <input type="checkbox" id="themeToggle"></label>
    </div>
  </header>
  <main>
    <section id="manage" class="page">
      <h2>Manage Products</h2>
      <form id="productForm">
        <input type="hidden" id="productId">
        <input id="productName" placeholder="Name" required>
        <input id="productPrice" type="number" step="0.01" placeholder="Price" required>
        <input id="productAmount" type="number" placeholder="Amount" required>
        <button id="saveProduct">Save</button>
        <button id="cancelEdit" type="button">Cancel</button>
      </form>
      <table id="productsTable"><thead><tr><th>ID</th><th>Name</th><th>Price</th><th>Amount</th><th>Actions</th></tr></thead><tbody></tbody></table>
    </section>

    <section id="newSale" class="page" style="display:none;">
      <h2>New Sale</h2>
      <div id="productsList"></div>
      <h3>Cart</h3>
      <div id="cart"></div>
      <div id="totals">Total: ₱<span id="totalValue">0.00</span></div>
      <button id="finalizeSale">Finalize Sale</button>
    </section>

    <section id="viewSales" class="page" style="display:none;">
      <h2>Sales</h2>
      <div id="salesList"></div>
    </section>
  </main>

  <div id="notifications-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h3>Low Stock Notifications</h3>
      <div id="notifications-list"></div>
      <div class="modal-actions">
        <button id="close-notifications-modal">Close</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
